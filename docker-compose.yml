services:
    # Приложение
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: todo-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "if [ ! -f .env ]; then cp .env.example .env; fi; php artisan key:generate --no-interaction --force; php artisan migrate --seed --force; php-fpm"
        depends_on:
            - db
        networks:
            - todo

    # Веб-сервер Nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker-compose/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - todo

    db:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-todo}
            POSTGRES_USER: ${DB_USERNAME:-todo}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - todo

networks:
    todo:
        driver: bridge

volumes:
    pgdata:
        driver: local
